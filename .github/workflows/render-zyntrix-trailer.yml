name: Render Zyntrix trailer

on:
  push:
    paths:
      - "trailer/**"
      - ".github/workflows/render-zyntrix-trailer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zyntrix-trailer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trailer/package.json
      - name: Install dependencies
        working-directory: trailer
        run: npm install --no-audit --no-fund
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Render 45-second 1080p animation
        working-directory: trailer
        run: npx remotion render src/index.ts Trailer out/raw.mp4 --codec h264 --crf 18 --concurrency 4
      - name: Compose generated soundtrack
        working-directory: trailer
        run: |
          python3 scripts/make_score.py
          ffmpeg -y -hide_banner -loglevel error -i out/raw.mp4 -i out/score.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart out/zyntrix-os-cinematic-trailer.mp4
      - name: Verify duration and streams
        working-directory: trailer
        run: ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json out/zyntrix-os-cinematic-trailer.mp4
      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: zyntrix-os-cinematic-trailer
          path: trailer/out/zyntrix-os-cinematic-trailer.mp4
          if-no-files-found: error
          retention-days: 14
