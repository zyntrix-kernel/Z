name: Render Zyntrix trailer

on:
  push:
    paths:
      - "trailer/**"
      - ".github/workflows/render-zyntrix-trailer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zyntrix-trailer-{{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trailer/package.json
      - name: Install dependencies
        working-directory: trailer
        run: npm install --no-audit --no-fund
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Render 45-second motion graphics
        working-directory: trailer
        run: npx remotion render src/index.ts Trailer out/zettings-film-v9-silent.mp4 --codec h264 --crf 17 --concurrency 4
      - name: Mix the reference soundtrack
        working-directory: trailer
        run: |
          curl -fsSL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3K32CiOAcurw0eVrpkaRJB6SxXB/09c16e4d-178d-4c9d-a5dd-bc9f387f7be7.mp4' -o /tmp/zettings-reference.mp4
          ffmpeg -y -hide_banner -loglevel error -i out/zettings-film-v9-silent.mp4 -i /tmp/zettings-reference.mp4 -filter_complex '[1:a]atempo=0.97777778,afade=t=in:st=0:d=1.0,afade=t=out:st=42:d=3.0[a]' -map 0:v:0 -map '[a]' -c:v copy -c:a aac -b:a 192k -t 45 -movflags +faststart out/zettings-film-v9-peak.mp4
      - name: Verify export
        working-directory: trailer
        run: |
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,r_frame_rate -of json out/zettings-film-v9-peak.mp4
      - name: Upload finished MP4
        uses: actions/upload-artifact@v4
        with:
          name: zettings-film-v9-peak
          path: trailer/out/zettings-film-v9-peak.mp4
          if-no-files-found: error
          retention-days: 14
